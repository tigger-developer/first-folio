    findings:
      - id: F2
        severity: blocking
        location: "spec.org:507-513, 557-560; RT073.3 at 282-285; AT073.3 at 318-321"
        requirement: "The accepted Superscale risk retains user/OS interruption and cleanup as required behaviour; ARCHITECTURE requires the essential mechanism and TESTING requires relevant interruption coverage."
        evidence: "The design asserts interruption cleanup but defines neither the supported graceful interruption boundary nor child-process and cleanup completion. The tests cover ordinary results, lookup failure and process/output failure, but not interruption."
        impact: "Delivery would need to invent consequential signal/cancellation behaviour, and the cleanup outcome could remain unverified."
        required_correction: "Define the supported graceful interruption path, child-process outcome, target-publication result and cleanup mechanism; add a controlled automated interruption case without adding a deadline or output/resource ceiling contrary to the accepted risk."
      - id: F7
        severity: blocking
        location: "spec.org:29-30, 50, 341-348, 359-360, 375-378, 421, 424, 476, 559, 589"
        requirement: "ISSUES' ABC contract requires every substantive paragraph and bullet to carry selective native-Org bold emphasis whose bold-only reading preserves functional meaning."
        evidence: "Material Synopsis changes, edge-case conditions/outcomes, flow steps, compatibility consequences and the revisit trigger remain unbolded or omit substantive qualifications; a handoff item bolds bare test-ID ranges."
        impact: "The bold-only scan omits material behaviour and boundaries, so the approval artefact does not meet its accessibility contract."
        required_correction: "Apply selective native Org emphasis to the remaining substantive content, including negations and qualifiers, while avoiding whole sentences, generic labels and identifiers."
      - id: F8
        severity: blocking
        location: "spec.org:454, 470; RT073.1 at 258-260"
        requirement: "The operator requires blur and equal padding in em or mm."
        evidence: "overlay.blur accepts only a non-negative mm length, while only padding accepts em or mm."
        impact: "A required valid configuration such as blur: 0.5em would be rejected, and its font-relative interpretation is undefined."
        required_correction: "Permit non-negative em and mm blur values, define how em resolves for the affected text region, and add valid and invalid unit-boundary cases."
      - id: F9
        severity: blocking
        location: "spec.org:578, 589"
        requirement: "The operator and selected standards require every human-facing acceptance-criterion or test identifier to have an adjacent descriptor."
        evidence: "UT073.1 appears bare, and RT073.1-3 / AT073.1-3 are descriptorless ranges."
        impact: "Those references are opaque without navigation and violate the supplied drafting constraint."
        required_correction: "Replace each bare identifier or range with individually described test references or descriptive links."
