      - id: F2
        severity: blocking
        location: "spec.org:342-358, 424-436, 483-495; RT073.3 at 235-245"
        requirement: "ARCHITECTURE requires material failure and resource bounds; CODING requires explicit failure handling rather than an indefinitely blocked operation."
        evidence: "Superscale output capture is only called bounded; no process deadline, diagnostic ceiling, cancellation result or stalled-process case is specified. Existing project external writers use explicit deadlines and bounded diagnostics."
        required_correction: "Define process deadline, stdout/stderr limits, cancellation/error diagnostic and cleanup outcome; add RT cases for a stalled process and output overflow."
      - id: F3
        severity: blocking
        location: "spec.org:299-303, 342-373, 444-448"
        requirement: "ARCHITECTURE requires significant algorithms and failure decisions to be resolved sufficiently for handoff."
