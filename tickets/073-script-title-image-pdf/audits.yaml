    criteria:
      - "INDEPENDENT-AUDITOR.md, READING.md and REVIEW.md as deployed on 2026-11-07"
      - "ISSUES.md, ARCHITECTURE.md, TESTING.md, CODING.md, SECURITY.md, DOCUMENTATION.md, ORG-SCHEMA.md and selected Go standard as deployed on 2026-11-07"
      - "Project profile, named product/configuration/architecture authorities, current title-page template, renderer, configuration loader, public conversion route and relevant tests"
