# British prose manuscript layout.
# Loaded as the manuscript base; user script.yaml values override this.

folio:
  page: a4
  font: Libertinus Serif
  font-size: 12pt
  heading-font: Libertinus Sans
  heading-font-size: 14pt

  manuscript:
    style: british
    page: a4
    margin: 20mm

    font: Libertinus Serif
    font-size: 12pt

    heading-font: Libertinus Sans
    heading-font-size: 14pt
    heading-font-weight: regular

    mono-font: Libertinus Mono
    mono-font-size: 10pt
    mono-font-weight: regular

    title-font: Libertinus Sans
    title-font-size: 20pt
    title-font-weight: bold

    subtitle-font: Libertinus Sans
    subtitle-font-size: 14pt
    subtitle-font-weight: regular
    subtitle-font-style: italic

    author-font: Libertinus Sans
    author-font-size: 12pt
    author-font-weight: regular
    date-font: Libertinus Sans
    date-font-size: 10pt
    date-font-weight: regular
    date-format: "2 January 2006"

    version-font: Libertinus Sans
    version-font-size: 10pt
    version-font-weight: regular

    wordcount-font: Libertinus Sans
    wordcount-font-size: 10pt
    wordcount-font-weight: regular

    contact-font: Libertinus Sans
    contact-font-size: 10pt
    contact-font-weight: regular

    line-spacing: 1.5
    letter-spacing: 0em
    justify: true
    widow-orphan-control: true
    paragraph-indent: 10mm
    paragraph-spacing: 0

    title-page:
      enabled: true
      page-number: false
      include-title: true
      include-subtitle: true
      include-author: true
      include-date: true
      include-wordcount: true
      include-contact-name: true
      include-address: true
      include-phone: true
      include-email: true
      include-website: true
      include-version: true
      # Alignment values are the literal tokens `left`, `center`, and `right`, or a
      # vertical-horizontal pair combining `top`, `center`, or `bottom` with those
      # horizontal tokens, for example `top-left`, `center-right`, or `bottom-center`.
      title-block-align: center # Positions title, subtitle, and author when their align value is empty.
      footer-align: center # Aligns items retained in the British footer grid: version | wordcount | date.
      title:
        align: "" # Empty uses title-block-align; another alignment positions the title independently.
      subtitle:
        align: "" # Empty uses title-block-align; another alignment positions the subtitle independently.
      author:
        align: "" # Empty uses title-block-align; another alignment positions the author independently.
      date:
        align: "" # Empty retains the date in the footer grid; another alignment positions it independently.
      wordcount:
        align: "" # Empty retains the word count in the footer grid; another alignment positions it independently.
      version:
        align: "" # Empty retains the version in the footer grid; another alignment positions it independently.
      contact:
        align: top-left # Positions the contact block independently; top-left is the British default.

    page-header:
      enabled: true
      font: Libertinus Sans
      font-size: 10pt
      font-weight: regular
      format: "[title] • [chapter] • [author]"
      align: left-right
      distance-from-edge: 20mm
      content-padding-after: 10mm

    page-footer:
      enabled: true
      font: Libertinus Sans
      font-size: 10pt
      font-weight: regular
      format: "[page]"
      align: center
      distance-from-edge: 20mm
      content-padding-after: 10mm

    toc:
      enabled: true
      links: true
      title: "Contents"
      page-break-before: true
      font: Libertinus Sans
      font-size: 10pt
      font-weight: regular
      heading-font: Libertinus Sans
      heading-font-size: 16pt
      heading-font-weight: bold
      include-parts: true
      include-chapters: true
      include-sections: false
      dot-leaders: true
      page-numbers: true
      line-spacing: 1.15em
      part-gap-before: 0.5em
      continuation-padding-before: 15mm
      part-bold: true

    scene-break:
      marker: "#"

    list:
      space-before: 0.5em
      space-after: 0.5em

    table:
      space-before: 0.5em
      space-after: 0.5em

    code-block:
      space-before: 0.5em
      space-after: 0.5em

    part:
      page-break-before: true
      vertical-align: center
      align: center
      case-transform: as-written

    chapter:
      page-break-before: true
      position: one-third
      align: center
      case-transform: as-written
      space-after: 2em
      number-reset: never

    # #21: copyright page. Disabled by default; when enabled, the British preset
    # supplies moral-rights, all-rights-reserved, and NLI/BL legal-deposit text.
    # Users can override the body list wholesale in local script.yaml.
    copyright:
      body:
        - "The moral rights of the authors and photographers to be identified as the creators of their work have been asserted."
        - "**All rights reserved.** No part of this publication, including text or images, may be reproduced, stored in a retrieval system, or transmitted in any form or by any means without prior written permission from the respective copyright holder."
        - "Legal deposit copies lodged with the National Library of Ireland, the five designated Irish libraries, and the British Library. A catalogue record is available from the National Library of Ireland."
