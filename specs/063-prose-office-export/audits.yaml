      response: |-
        GATE: definition
        REVISION: sha256:30f9c38b744fbf6522d9e5878225985dd5387edb12507041dd734fc767109bf4 (specs/063-prose-office-export/spec.org)
        VERDICT: PROVISIONAL PASS

        **Standards applied:** MAIN, AUDITS, ARCHITECTURE, TESTING, ISSUES, DOCUMENTATION, ORGMODE, ORG-SCHEMA, MARKDOWN (for the README, docs and help evidence), and technologies API, GO, RUST and SHELL. RUST and SHELL are in the project profile but have no code in this change. API applies only loosely, because this is a CLI and not a service.

        **Evidence limits:**
        - The canonical `templates/v3/spec.org`, `audits.yaml`, `feedback.yaml`, the `Makefile`, `docs/format-manuscript-org.md` and the existing office test helpers were not supplied.
        - Template conformance was therefore judged against ORG-SCHEMA.md and ISSUES.md only.
        - No feedback processing was evidenced, and none is required.

        **Checked and found conforming:**
        - **Schema:** `#+TITLE` and `#+SCHEMA: 8` are present. `#+OPERATOR_SIGNOFF: PENDING` is correct. The Synopsis has the eight required categories with `CUSTOM_ID: summary`. All ACs carry `:ac:` and all tests carry `:testdef:`, with unique, correctly formed IDs and descriptive titles.
        - **Annotations and audit state:** the spec contains no annotation records or blocks, and no duplicated audit findings, rounds or session IDs. It only links to the harness-owned `audits.yaml`.
        - **Traceability:** every AC maps to tests and every test back to its ACs, including the UT-to-AC cross-listings. I checked each pairing and found no orphan test or AC.
        - **Test classification:**
          - The rendered LibreOffice-to-PDF/PNG checks (RT063.11, RT063.12) are bounded and local, and they use independent expectations.
          - OT063.1 and the feature UTs are correctly separated from them.
          - The run order is defined: RTs, then the OT, then the UTs.
          - Pagination is explicitly not pixel-compared across layout engines.
          - Word behaviour is correctly left to a UT.
        - **Reference fixtures:** the fixture and checklist design is sound. Labels are written independently of the renderer, there is a key-to-test mapping, and the footnote font is not invented.
        - **Scope and design:**
          - The design stays within the authorised full-fidelity scope. It adds no new YAML, no source syntax and no office input.
          - The new `internal/office` package is justified: `internal/manuscript` cannot import `internal/app`.
          - Script writers are explicitly left in place.
          - There is no template inflation.
          - Security impact, resource bounds, atomic publication and the partial-batch and sidecar outcomes are specified and tested.

        **Bounded follow-ups (non-invalidating):**
        1. **Feasibility of the hard native mappings.**
           - The spec correctly makes any unmeetable mapping a blocker requiring amendment, but feasibility is unproven.
           - The riskiest mappings are odd/even forced blank pages in ODT, physical-versus-displayed page numbering, continuous frontmatter/body transitions, and multi-page native contents.
           - Before bulk implementation, a minimal spike of these mappings should be recorded in `validation.org`. If a mapping fails, the amendment goes to the operator and is not silently downgraded.
        2. **Scope of new letter path rules versus AC063.10.**
           - The publication rules add collision preflight, prefix traversal rejection and output-directory containment for letters. AC063.9 scopes these to office conversion.
           - The Design and Synopsis wording does not say whether they also apply to `--format pdf`, which today silently overwrites duplicate slugs.
           - Add one sentence stating that they are office-only. If they are meant for PDF too, that is a behaviour change needing an operator decision.
        3. **Office hyphenation.**
           - The spec says "native policy plus the existing offline discretionary-break mechanism where needed". That mechanism currently produces a Typst dictionary.
           - State whether and how the break points are applied in office text, or confirm that native hyphenation policy alone satisfies the AC. This is a routine clarification.
        4. **Release and contributor consequence.**
           - RT063.11 and RT063.12 make LibreOffice a hard prerequisite of `make test`, and therefore of `make release`.
           - The documentation list names the README. During delivery, also record the prerequisite check, with a clear missing-tool failure, in the README or Makefile documentation.
