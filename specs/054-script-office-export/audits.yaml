      revision: 4a1fb10 plus internal/app/office_export_test.go, office_layout_test.go, office_test_helpers_test.go
      verdict: FAIL
      response: |-
        GATE: test-code
        REVISION: 4a1fb10 plus internal/app/office_export_test.go, office_layout_test.go, office_test_helpers_test.go
        VERDICT: FAIL

        Standards applied: TESTING.md (primary), CODING.md, technologies/GO.md, AUDITS.md, ARCHITECTURE.md. Project-selected technology GO applies; API/RUST/SHELL have no subject matter in this test-only delta. All applicable standards were read; no material access gap.

        Verified sound (not findings):
        - Boundary: all RT054 tests exercise the built folio executable and assert on generated office packages, not source text; no source greps or implementation-coupled assertions. officeAssertStyleUsed prevents declared-but-unused styles from satisfying checks.
        - RED evidence: rt-red.txt shows intended assertion failures at the public executable ("Unrecognised format/extension"), not compilation or setup failure; tests compile and reach the boundary. RT054.4 GREEN preservation is legitimate with the recorded rationale and passing baseline (rt-baseline.txt, rt-preservation.txt).
        - Doubles: the synthetic Pandoc (test binary behind FOLIO_TEST_PANDOC_FAILURE) is confined to documented process failure modes (missing, exit, malformed output, timeout) plus the empty-JSON discovery stub, matching RT054.3's retention clause; it does not simulate Pandoc formatting.
        - Determinism and hygiene: temp HOME/TMPDIR isolation, scratch-leak checks, target-preservation checks, platform-skipped PTY guard, explicit t.Fatal when required Pandoc is absent per RT054.1 retention.
        - Inventory: validation.org carries one tagged heading per defined RT/UT/OT with RED/GREEN/AMBER states matching test-readiness.yaml; UT/OT AMBER deferral with recorded reasons is eligible at this gate.

        Findings (all against the signed-off RT definitions; remediation is test-package completion before implementation, not changed requirements):

        1. RT054.1 Setup explicitly requires "additional rich Org/Markdown fixtures". Only a rich Org fixture exists. Inline bold/italic/combined/underline/literal, cast tables, footnotes, transitions and intro material are never exported from a Markdown source; the basic .md matrix fixture contains none of them. AC054.1's inline-formatting and footnote semantics are therefore tested only via Org.
           Remediation: add a rich Markdown fixture to the rich-and-filtered subtest and assert the same native content properties per format.

        2. Prop-text events are absent from every fixture. RT054.1 Setup requires fixtures "with each supported event" and AC054.1 lists props; the normative layout mapping fixes prop representation (centred bold italic, fixed spacing). No :prop: / ***"TEXT"*** element appears anywhere, so prop export is untested in RT054.1 and RT054.2.
           Remediation: add prop text to the rich fixtures and assert its native representation (centred, bold+italic, fixed spacing).

        3. RT054.1 Expected requires "resolved footnote references". The test asserts note content exists in word/footnotes.xml but never asserts the dialogue position carries a resolved native reference (docx footnoteReference bound to the note id; ODT note anchor).
           Remediation: assert the body reference is natively linked to the emitted note.

        4. RT054.2 Expected requires "compact/dedicated/missing title behaviour". Compact and dedicated are covered; missing title is not. Untitled exports appear only in RT054.1 with package-validity checks and zero content assertions. The signed-off title rule (no separate title page when the title is absent; first-page running matter not suppressed for untitled scripts) is untested for office output.
           Remediation: add an untitled case asserting no title-page composition and that running matter applies to page 1 in dedicated mode.

        5. RT054.2 Expected requires "first/later act breaks". TestRT054_2OfficeActBreaks asserts only the later act's native break. No assertion that compact mode omits the break before the first act, or that dedicated mode separates the first act from the title composition, per the layout mapping's first-act rule.
           Remediation: assert no native page break before ACT ONE in compact mode, and title/first-act separation in dedicated mode.

        6. RT054.2 Expected requires "explicit empty variants". The test configures alt-frontmatter-format: '' but asserts only presence of the non-empty variants. The explicit-empty semantics (blank odd-frontmatter header/footer) are never asserted, unlike the maintained PDF suite (TestScriptRunningExplicitEmptyFrontmatterAlternate).
           Remediation: assert the corresponding odd-frontmatter header and footer definitions are present but empty.

        7. RT054.2 Action requires covering each layout-mapping row; several rows are only partially asserted:
           a. Cast table: 30%/70% two-column widths unasserted (presence only).
           b. Directions/transitions: only role fonts asserted; effective before/after spacing, inset, alignment and casing unasserted.
           c. Title row: role fonts and multi-line author prefix asserted; title vertical offset/alignment, subtitle/author spacing and date/version slot positioning unasserted.
           d. Lengths row: em-derived lengths (resolved against the role font size) never exercised; only pt/mm/percent/tracking asserted.
           e. Footnotes row: "preserved inline formatting" untestable as fixture — the note text is plain.
           f. Paper/margins row: body top/bottom margins from running-matter edge distance plus clearance unasserted; only pgMar left and pgSz checked.
           Remediation: extend the TestRT054_2* cases with the corresponding fixtures and assertions; expected values derive from the same merged configuration the tests already construct.

        Positive note on findings 1-7: the test architecture, helpers and assertion machinery are in place, so each remediation is an additive extension of existing files. They are nonetheless required before implementation, because the current package would admit an implementation that drops these specified cases and still pass.

        CANARY: TEST CODE GO AUDIT ARCH
