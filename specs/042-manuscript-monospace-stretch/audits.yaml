            Evidence read: all 28 manifest paths in full (the nine SDLC standards newly added this round, config.md and W039 spec.org sufficient for the claims relied on). No files edited, no commands run.

            Prior findings reassessed against the revised revision:

            F2 (RT042.1 observation mechanism) — RESOLVED. The context/metadata probe is gone. RT042.1 now asserts the emitted construct containing each marker (inline raw content rather than a three-property `#text` wrapper), inspects the six arguments of the governing `raw.where(block: false)` rule in the generated artefact, and compiles the unmodified emitted document. An explicit evidence boundary defers resolved-width claims to UT042.1, and the W039 configuration-normalization scope creep ("`117.5` and `117.5%` normalize equivalently") has been removed and reassigned to the existing W039 regressions. These are observable public-output assertions, not source-text greps.

            F3 (unreconciled regression) — RESOLVED. RT042.2's "Existing assertion disposition" names `TestRenderInlineMarkup`, amends it in place, retains its identifier, links the changed assertion to RT042.2, and states exactly which assertions are preserved (dash conversion, bold, italic, literal `kevin_murray` content, downstream parsing) and which expected spelling is superseded. This follows the W039 lineage pattern.

            Non-blocking observations from round 3: the normalization scope creep and the TOC-silence point are closed (the unresolved-title section now names TOC reconciliation as part of the required decision).

            Findings requiring remediation

            F1 — Part/chapter title-scope and uppercase-code decision remains unresolved, and the specification is not sign-off-ready while it is. The new "Unresolved part/chapter title semantics" section correctly documents the facts: `caseTransform`'s `as-written` path calls `typstInline(text, Config{})`, producing empty font values including an invalid empty size literal, and this is the default path under the shipped British preset; the `upper` path escapes and uppercases backticks as ordinary content. The spec itself records "Decision required" and "Resolve the decision before delivery", and the audit context confirms no operator decision has been made; the earlier "w042 approved" predates this question. Per ISSUES.md, an open question that materially changes acceptance criteria must be resolved in the specification before implementation. The current artefacts are internally inconsistent around it:

            - The Synopsis outcome still claims inline code uses the configured font "wherever the supported renderer emits it", but AC042.1 covers only "code within section headings" and RT042.1's setup covers paragraph code, H3/H4 section code, and a code block — the part/chapter route is in neither.
            - RT042.2's "normal/uppercase heading controls" does not name which heading kinds it means; its meaning changes with the decision.
            - The "Recommendation" (include title code; uppercase only surrounding text, preserve literal code text) is explicitly a proposal, not an approved behaviour change to uppercase-title semantics. It cannot be treated as resolved by the rerun request.

            Required remediation: obtain the operator's decision on (a) whether part/chapter heading code is in scope, and (b) if in scope, what `case-transform: upper` does to code spans in such headings, including TOC entry appearance. Then either include the route — extending AC042.1 and a test definition covering both `case-transform` values and the TOC outline path — or exclude it explicitly in AC042.1's wording, record the current empty-literal and upper-path behaviour as a known limitation, and tighten the Synopsis's "wherever the supported renderer emits it" to the routes actually covered. This is an operator decision on behaviour, not a documentary fix; the gate cannot pass on a spec that carries its own unresolved blocker.

            Non-blocking observation (no gate action required): the "Test-design history" bullet in RT042.1 is acceptable as design revision history of the artefact itself; it records no audit verdict, round, session, or status, so it does not duplicate audit state. Keep it that way — do not add audit outcomes to the spec or validation.org; the audit record belongs solely to the harness in audits.yaml.
