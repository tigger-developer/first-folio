            REVISION: W042 definition set as supplied (spec.org sha256 `8e2c3b45…`, validation.org sha256 `008a81e6…`)
            VERDICT: FAIL

            **Evidence read:** all 18 manifest paths (config.md lines 1–130 and W039 spec.org lines 1–539 read in part, sufficient for the claims relied on; all other files read in full). No files edited, no commands run.

            **Confirmed accurate in the proposal** — the defect analysis holds against the code. `renderInlineMarkup`'s backtick branch emits only family/size/weight (`internal/manuscript/render.go:864`); the template applies all six properties through `#show raw.where(block: false)` (`templates/manuscript.typ:212`); the paragraph route keeps Pandoc's raw markup and therefore already picks up that rule (`internal/manuscript/manuscript_test.go:419`); and the existing manuscript font test passes on a whole-document marker search (`internal/manuscript/font_test.go:49`) where the script equivalent counts occurrences (`internal/app/font_config_test.go:77`). `folio.manuscript.mono.font` is in RT039.1's authoritative inventory (`specs/039-unified-font-configuration/spec.org:534`), so the AC039.1 authority claim is sound. No audit findings, status, revisions, round numbers, or session IDs appear in the specification.

            ## Findings requiring remediation

            **F1 — Affected rendering route omitted: part/chapter heading code.**
            `renderBlocks` sends part and chapter heading text through `caseTransform` (`render.go:405`, `:426`), which for any mode other than `upper` calls `typstInline(text, Config{})` (`render.go:1007`). With a zero-value `Config`, the backtick branch emits `#text(font: "", size: , weight: "")[…]` — empty size and weight literals, no configured mono values. The shipped default is `case-transform: as-written` for both part and chapter (`presets/british.yaml:508`, `:519`), so this is the default path, not an exotic one. Under `upper`, the backticks are escaped and upper-cased, so code in such a heading renders as literal backticks in the heading font.
            The specification names this call only as a drawback of the rejected alternative (`spec.org:279-280`). AC042.1 claims inline code "wherever the supported renderer emits it" (`spec.org:12-13`, `:147-149`), but RT042.1 and RT042.2 set up only paragraph code, H3/H4 section code, and a code block.
            **Required:** state explicitly whether part/chapter heading code is in scope. If in scope, cover it in AC042.1 and in a test definition across both `case-transform` values; if out of scope, exclude it in the criterion wording and record the current behaviour as a known limitation. The `upper` behaviour is an operator decision, not a documentary fix.

            **F2 — RT042.1's observation mechanism is not established as feasible.**
            RT042.1 asserts inspection of "the font settings in effect at each marked code span" via a "test-only Typst context/metadata probe … on emitted content" that "must not replace the production styling rules" (`spec.org:184-190`). The mono properties exist only inside the `text(...)` wrapper constructed by the production show rule (`templates/manuscript.typ:212-214`); a probe inserted beside the span in the emitted source is outside that wrapper, and the specification offers no evidence that a probe can read styles inside it without standing in for the rule. This contrasts with the design's feasibility probe, which is evidenced with measurements (`spec.org:268-273`). The constraint that persistent tests must not depend on privately installed fonts (`spec.org:297-299`) also rules out observing stretch through actual face selection in a regression test.
            This matters because RT042.1 is the first delivery step and must fail on the baseline for the right reason (`spec.org:309-311`).
            **Required:** name a concrete, evidenced technique per asserted property, or restate RT042.1 at what it can observe — the emitted construct at the span boundary and the rule that governs it — and leave width evidence to UT042.1.

            **F3 — An existing regression the change invalidates is neither named nor reconciled.**
            `TestRenderInlineMarkup` (`internal/manuscript/manuscript_test.go:428-433`) pins both the four-argument `renderInlineMarkup` signature and the exact `#text(font: "Libertinus Mono", size: 10pt, weight: "regular")[kevin\_murray]` output. Design steps 1 and 3 remove both (`spec.org:255-262`). RT042.2's retention line says only "retain existing parsing regressions" (`spec.org:210-211`).
            **Required:** name the affected assertions and state their disposition — replaced in place with provenance retained, per the lineage pattern W039 used (`specs/039-unified-font-configuration/spec.org:388-410`) — or define an equivalent reconciliation step.

            ## Non-blocking observations (no gate action required)

            - **Wording:** the summary's "wherever the supported renderer emits it" is broader than the routes actually covered; tightening it resolves the documentary half of F1.
            - **Scope creep in a test definition:** RT042.1's "`117.5` and `117.5%` normalize equivalently" (`spec.org:188-189`) tests configuration normalization belonging to W039's contract (`docs/config.md:113`); it is not needed to prove AC042.1.
            - **TOC:** section, chapter, and part headings are outlined (`templates/manuscript.typ:61`, `:108`, `:152`), so a raw span in a heading will also be styled in TOC entries. The "Unchanged" list is silent on this; one sentence would close it.
            - **Diagnosis quality:** the single-width control and the "Limit" paragraph (`spec.org:98-104`) correctly decline to claim more than the reproduction supports. No change needed.
