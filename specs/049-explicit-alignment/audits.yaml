            ## Bounded follow-up required (does not invalidate implementation sign-off)

            - **F1 — `docs/ARCHITECTURE.md` Configuration section is incomplete on the new validation boundary.** Line 59 still reads "deep-merges ordinary keys and partial font blocks, validates every effective font role, and provides typed font values". The delta makes `internal/config` the owner of a second validated domain and moves the YAML→Typst allowlist boundary into the loader (spec §Security impact; `internal/config/alignment.go:40-64` running at `config.go:99-101`, after every merge layer and before typed decode). The renderers still contain alignment parsers (`internal/manuscript/alignment.go`), so the ownership split is not self-evident from the code. **Required correction:** extend that paragraph to state that the loader validates every shipped alignment field against its allowlist after layer merging. `docs/config.md:522-541` already covers the user-facing contract and needs nothing further.

            ## Verified as conformant

            - **Inventory is exhaustive.** I enumerated every `align` / `*-align` key in `presets/british.yaml` independently: 27 paths, matching `alignmentFamilies` (15 + 1 + 2 + 3 + 6) and the test's `alignmentFields` exactly. `us.yaml` and `screenplay.yaml` introduce no alignment path outside that set.
            - **AC049.1.** Validation runs after all shared layers and CLI overrides, before decode or output; non-string, null, empty, whitespace, unknown and compound-malformed values fail with path, `%#v` of the rejected input and the allowed list. Inactive roles and other modes are covered because the British base always supplies all 27 paths.
            - **AC049.2.** `TitleItemAlign("group")` returns an empty expression, so the six items fall through to the existing group branch (`templates/manuscript.typ:284-328`); `group` is rejected at `title-block-align`, `footer-align` and `contact.align` (family 4 excludes it), which `TestRT049GroupRejectedOutsideTitleItems` covers — its skip predicate correctly excludes only the six, since `title-block-align` does not match `.align`.
            - **AC049.3.** Omitted overrides inherit (validation reads merged values); explicit null fails as specified; empty/null `publisher`, `isbn`, `prefix`, `suffix` remain accepted and are exercised for both manuscript and script PDF output.
            - **Test quality.** Tests act through the built executable and assert real PDF word geometry rather than template text, per TESTING.md "test from the user's boundary"; each test carries an adjacent RT descriptor; the implemented cases match the RT049.1/.2/.3 actions and expectations item for item (ten invalid forms, both output extensions, nine title compounds, twelve page-pair forms, five vertical aliases). `t.Setenv` use is consistent with the absence of `t.Parallel`.
            - **Preset delta.** Six `align: group` values, two explanatory comment lines (340-341), and the US `include-date` / `include-version: false` flags. `RT039_4` still holds because British ships `true` for both. `TestRT039_2BritishBaseIsNormativeSharedRuntimeBase` compares the load against the installed asset, so the changed defaults keep it valid, and its comment records the supersession without deleting the historical fixture.
            - **Security.** Net improvement: `chapter.align`, `part.align`, `copyright.align` and the running-matter aligns previously reached `align(...)` in the template unfiltered; they are now allowlisted, with `#panic()` among the rejected inputs.
            - **Scope and proportionality.** One 65-line file, six preset values, one template footer row, one documentation section. No new dependency, framework or configuration layer.

            ## Observations — not findings, no action required at this gate

            - **Residual unvalidated placement keys.** `folio.manuscript.chapter.position` and `part`/`title-page` `position` values still interpolate raw into Typst (`render.go:923-934` returns the input unchanged on an unknown value). Pre-existing and explicitly outside the authorized alignment inventory (spec §Edge Cases).
            - **Narrowed undocumented vocabulary.** Typst's `start` / `end` would previously have passed through the script positioning fields; they now fail. Authorized by AC049.1 and documented at `docs/config.md:539`.
            - **Stale font/spacing facts in `docs/config.md:149-156`** (body 12pt, "Libertinus Mono, 10pt", `paragraph-indent: 10mm`) do not match the preset text supplied. These are font/spacing keys, i.e. the user-owned uncommitted preset area excluded from this delta — raised for the operator, not as W049 remediation.
            - **Failure messages** at `alignment_config_test.go:92,95,117,119` state the expectation but not the observed coordinates.
            - **`TestRT039_2CopiedBritishBaseLeavesPublicOutputsUnchanged`** fails identically at baseline and candidate on the external `pdf-to-png` helper, so it does not currently evidence base-copy output stability; OT049.1's baseline/candidate word-box comparison covers that ground independently and more strictly.

            ## Limits of this review

            - This adapter has read-only file access: no shell, no `git`. I could not execute tests or diff the tree, so RT/OT GREEN and the three identical baseline/candidate failures rest on the `validation.org` record, which states them specifically and does not claim a GREEN full suite.
            - The `presets/british.yaml` text supplied is the working tree, which includes the user's uncommitted font/spacing/header edits; my assessment of that file is confined to the six `align` values, the two added comments and the alignment inventory.
            - No audit status, revision or finding was written to any specification, ticket or other file; nothing was edited.
