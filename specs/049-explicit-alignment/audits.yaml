        **Condition (bounded, reversible; does not invalidate definition sign-off)**

        - **AC049.1 cross-mode clause is not exercised by its only proving test.** AC049.1 asserts validation applies "even when the role is disabled or belongs to another mode". RT049.1's defined Action submits each path "through the owning mode", and `internal/manuscript/alignment_config_test.go:42` selects `manuscript` for `folio.manuscript.*` and `convert` otherwise. The disabled-role condition **is** covered (the fixture disables `page-header`, `page-footer` and `toc`, and those `.align` paths are still rejected). The other-mode condition is not: no case submits an invalid `folio.manuscript.*.align` through `folio convert`, or an invalid script alignment through `folio manuscript`. The implementation does validate all 27 paths irrespective of `Mode` (`internal/config/config.go:99`, `internal/config/alignment.go:40-63`), so this is a coverage gap in a compound requirement (TESTING.md, "Cover each independent condition in a compound requirement"), not a behavioural defect. **Remediation:** either extend RT049.1's Action and retention with one cross-mode case (initially GREEN preservation evidence is legitimate; no artificial RED required), or narrow AC049.1's wording to the condition actually proven. Either is documentary/test-definition work within the existing allowance.

        **Observations — no action required at this gate, not verdict conditions**

        - The newly reachable US title-page footer row (enabling `include-date` / `include-version` previously produced nothing) is behaviour beyond a pure validation fix. It is disclosed in spec.org Context ("Scope decisions"), traced to AC049.2/RT049.2, and default US output is unchanged per OT049.1. It is already before the operator (`#+OPERATOR_SIGNOFF: PENDING`); no auditor action.
        - Non-alignment placement fields interpolated into Typst (`folio.manuscript.chapter.position` via `templates/manuscript.typ:147`, script `title-page.*.position`) remain unvalidated. Pre-existing, explicitly outside the authorized scope, and the spec's security claim is correctly scoped to alignment only — it does not assert the boundary is closed. Not grounds for a finding here.

        **Checks satisfied**

        - **Annotations/audit state:** spec.org contains no annotation record or block of any kind (only `:PROPERTIES:` drawers with `CUSTOM_ID`); no findings, verdicts, revisions, round numbers or session IDs are duplicated — audits.yaml is linked, which AUDITS.md permits. No `feedback.yaml` was supplied.
        - **Schema/traceability:** 3 ACs `:ac:`, 4 tests `:testdef:`, IDs matching across both documents; validation.org declares `#+TODO: AMBER RED | GREEN`, carries RT `REVISION`/`COMMAND`/`EVIDENCE` and OT `REVISION`/`EVIDENCE`; no execution states in spec.org; no RT-ID reuse (RT-15.x preserved, RT049.x new). Every AC has a proving test; no orphan tests.
        - **Test classification:** OT049.1 is correctly a one-off (baseline-versus-candidate build comparison cannot be a persistent RT) with recorded bounds and rationale; the absence of a UT is explicitly reasoned and the asserted outcomes are objective geometry. External raster-helper failures are disclosed as identical in baseline and candidate, with no passing full suite claimed.
