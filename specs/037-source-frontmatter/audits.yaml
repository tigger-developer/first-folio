            Assessment of the TOC line-spacing delta:

            Scope and design conformance
            - The delta matches the recorded continuation exactly: toc.line-spacing now uses the same positive-finite-multiplier definition as body line-spacing (W048's established contract), evaluated against the TOC's own font metrics, independent of the body setting. The Go side shares one normalizeLineSpacing(value, field, gapField) operation for both fields — the correct KISS factoring rather than a duplicated validator — with the TOC diagnostic pointing to toc.part-gap-before, which remains a length. No copyright spacing, heading-position, or new gap semantics were touched.
            - The template adds one shared helper, folio-line-leading(multiplier), used by both the body wrapper and the TOC block; the arithmetic is correct for both covered intervals: wrapped lines use par(leading: native*m − line-box) giving baseline intervals of native*m, and adjacent single-line entries use block below: leading, giving the same native*m baseline interval. Part-gap-before remains an additive block above for level-1 entries only.
            - presets/british.yaml sets toc.line-spacing: 1.15 (numeric); US inherits. The removed empty-string fallback means an explicit empty TOC value now fails — covered by the rejection matrix.

            Tests and evidence
            - RT037.5/6 RED was observed through the public CLI for the intended reasons: numeric TOC values previously emitted leading: 0.75 raw into Typst ("expected length, found float"), and 1em was accepted producing output. GREEN evidence covers sixteen font/size/multiplier combinations (2 fonts, 2 sizes, .75/1/1.5/2) with every wrapped and inter-entry interval measured against independently compiled native Typst reference PDFs within 0.03pt, plus British/US omitted-default equality with explicit 1.15. The rejection matrix covers eleven invalid values across Typst and PDF with the TOC enabled and disabled, asserting the full field path, offending value, multiplier examples, part-gap-before guidance and no output artefact — matching the code path, since validateConfig runs regardless of toc.enabled.
            - Affected existing tests were correctly reassessed rather than left stale: RT-30.3 now compares 1x/2x measured entry gaps, RT-31 fixtures migrated to numeric 1.15, and the manuscript contract tests assert the new folio-line-leading helper. Body spacing geometry (RT048) passes after sharing the helper; the isolated full go test ./... -count=1 passes, as do lint/build and git diff --check. User preset edits remain excluded and preserved.
            - validation.org explicitly bounds the earlier OT037.2 byte-identical evidence to the heading-defaults delta and records that TOC pagination intentionally changes — an honest supersession statement, not a silently dropped limitation.

            Documentation
            - docs/config.md 0.17 documents the shared multiplier definition, TOC font context, wrapped and adjacent-entry application, 1.15 default in both styles, independence from body spacing, and the required migration from length values, with a changelog entry — all matching delivered behaviour in impersonal factual voice. Schema, CLI help and architecture are legitimately unchanged (no new keys or interfaces). No audit-state duplication found; OPERATOR_SIGNOFF remains PENDING as appropriate for the route.

