---
folio:
  page-header:
    enabled: true
    font:
      family: Iosevka Publish
      size: 10pt
      weight: regular
      style: regular
      stretch: 100%
      letter-spacing: 0pt
    format: BODY-EVEN [page]
    alt-format: BODY-ODD [page]
    frontmatter-format: FRONT-EVEN [page]
    alt-frontmatter-format: FRONT-ODD [page]
    distance-from-edge: 20mm
    content-padding-after: 5mm
  page-footer:
    enabled: true
    font:
      family: Iosevka Publish
      size: 10pt
      weight: regular
      style: regular
      stretch: 100%
      letter-spacing: 0pt
    format: BODY-FOOT [page]
    frontmatter-format: FRONT-FOOT [page]
    distance-from-edge: 20mm
    content-padding-after: 5mm
  manuscript:
    font: &1
      family: Iosevka Publish
      size: 12pt
      weight: regular
      style: regular
      stretch: 100%
      letter-spacing: 0pt
    page: a4
    margin: 20mm
    gutter: 5mm
    line-spacing: '1'
    title-page:
      enabled: true
      include-title: true
      include-author: true
    toc:
      enabled: true
      title: CONTENTS-SAMPLE
      font: *1
      line-spacing: '1.5'
      include-parts: true
      include-chapters: true
      include-sections: true
      page-numbers: true
      links: true
      dot-leaders: true
      blank-page-after: true
      continuation-padding-before: 10mm
    chapter:
      page-break-before: false
      position: 0mm
      show-number: false
      skip-header: false
      skip-footer: false
    part:
      page-break-before: true
      blank-page-before: enforce-right
      show-number: false
      skip-header: true
      skip-footer: true
    page-numbering:
      frontmatter-format: i
      body-format: '1'
      body-reset: first-part-or-chapter
