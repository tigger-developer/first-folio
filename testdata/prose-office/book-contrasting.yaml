folio:
  page-header:
    enabled: true
    frontmatter-format: ''
    alt-frontmatter-format: ''
    align: center
  page-footer:
    enabled: false
  manuscript:
    style: us
    page: a4
    margin: 20mm
    gutter: 0mm
    title-page:
      enabled: false
      page-number: false
    toc:
      enabled: true
      title: "CONTENTS-CONTRAST: chapters only, no links, leaders or page numbers"
      include-parts: false
      include-chapters: true
      include-sections: false
      links: false
      dot-leaders: false
      page-numbers: false
      page-break-before: false
      blank-page-before: false
      blank-page-after: enforce-left
      line-spacing: 1
      part-bold: false
      continuation-padding-before: 5mm
    part:
      page-break-before: false
      blank-page-before: enforce-left
      blank-page-after: false
      skip-header: false
      skip-footer: false
      vertical-align: top
      align: right
      show-number: false
      show-name: true
      case-transform: lower
    chapter:
      page-break-before: false
      blank-page-before: false
      blank-page-after: false
      skip-header: false
      skip-footer: true
      position: 0mm
      align: right
      space-after: 1em
      explicit-numbering: source
      number-format: i
      number-reset: never
      show-name: true
      show-number: false
    copyright:
      enabled: true
      position: after-frontmatter
      credits: ["CONTRAST-CREDIT: after contents; no embedded barcode"]
      body: []
      publication: []
      publisher: ''
      isbn: '978-0-000000-00-2'
      isbn-barcode: file
      blank-page-before: enforce-right
      skip-header: false
      skip-footer: true
    page-numbering:
      frontmatter-format: '1'
      body-format: i
      body-reset: never
