folio:
  letter:
    page: us-letter
    font: {family: Iosevka Publish, size: 11pt, weight: regular, style: regular, stretch: 95%, letter-spacing: 0.2pt}
    margin-top: 20mm
    margin-bottom: 21mm
    margin-left: 22mm
    margin-right: 23mm
    space-after-sender: 4mm
    space-after-recipient: 3mm
    space-after-date: 2mm
    space-after-subject: 1mm
    space-before-closing: 5mm
    space-before-signoff: 6mm
  page-header:
    enabled: true
    format: LETTER-MUST-NOT-HAVE-THIS-HEADER
  page-footer:
    enabled: true
    format: LETTER-MUST-NOT-HAVE-THIS-FOOTER
